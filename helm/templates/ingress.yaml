{{- if .Values.ingress.enabled }}
{{- if not .Values.kong.enabled }}
{{- fail "ingress.enabled requires kong.enabled: the app has no login of its own" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mpm.fullname" . }}
  labels:
    {{- include "mpm.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mpm.fullname" . }}-kong
                port:
                  number: {{ .Values.kong.port }}
{{- end }}
